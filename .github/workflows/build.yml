name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Test and package mod
        shell: pwsh
        run: ./gradlew.bat build --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nocturne-mc26.1.2
          path: build/libs/*.jar
          if-no-files-found: error
