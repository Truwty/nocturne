name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Test and package mod
        shell: pwsh
        run: ./gradlew.bat build --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nocturne-mc26.1.2
          path: build/libs/*.jar
          if-no-files-found: error
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        renderer: [vanilla, sodium, iris]
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_GL_VERSION_OVERRIDE: '4.5'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Run Minecraft client checks
        run: xvfb-run -a ./gradlew runClientGameTest -Pcompat=${{ matrix.renderer }} --console=plain
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: client-test-${{ matrix.renderer }}
          path: |
            build/run/clientGameTest/screenshots/**
            build/run/clientGameTest/logs/**
            build/run/clientGameTest/crash-reports/**
          if-no-files-found: ignore
