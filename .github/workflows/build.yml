name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Test and package mod
        shell: pwsh
        run: ./gradlew.bat build --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nocturne-mc26.1.2
          path: |
            build/libs/*.jar
            build/release/nocturne-mc26.1.2.json
          if-no-files-found: error
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        renderer: [vanilla, sodium, iris, optimized]
        include:
          - renderer: vanilla
            modmenu: true
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_GL_VERSION_OVERRIDE: '4.5'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Run Minecraft client checks
        run: xvfb-run -a ./gradlew runClientGameTest -Pcompat=${{ matrix.renderer }} -PwithModMenu=${{ matrix.modmenu || false }} --console=plain
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: client-test-${{ matrix.renderer }}
          path: |
            build/run/clientGameTest/screenshots/**
            build/run/clientGameTest/logs/**
            build/run/clientGameTest/crash-reports/**
            build/run/clientGameTest/nocturne-performance.json
          if-no-files-found: ignore

  reproducible:
    runs-on: ubuntu-24.04
    needs: windows
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Compare two clean release builds
        run: python3 scripts/verify_release.py
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nocturne-mc26.1.2
          path: build/windows-artifact
      - name: Compare Windows and Linux release bytes
        run: python3 scripts/compare_release.py build/windows-artifact
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: release-reproducibility
          path: |
            build/release/*
            build/libs/*.jar
