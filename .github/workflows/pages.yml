name: Showcase website
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'src/main/resources/**', 'compatibility/**', 'scripts/build_site_*.py', 'scripts/tests/**', '.github/workflows/pages.yml']
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      catalog_sha256: ${{ steps.catalog.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Test catalog compatibility and URL validation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test loader and dependency selection
        run: node --test scripts/tests/catalog.test.mjs
      - name: Build verified release catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_site_catalog.py
      - name: Copy canonical screenshots and fonts
        run: python3 scripts/build_site_assets.py
      - name: Record deployed catalog checksum
        id: catalog
        run: echo "sha256=$(sha256sum site/releases.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
      - name: Verify the public download catalog
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.catalog_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import time
          import urllib.error
          import urllib.request

          expected = os.environ["EXPECTED_SHA256"]
          url = "https://truwty.github.io/nocturne/releases.json?deployment=" + expected
          for attempt in range(30):
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      actual = hashlib.sha256(response.read()).hexdigest()
                  if actual == expected:
                      print("Public download catalog matches the deployed artifact.")
                      break
                  print(f"Attempt {attempt + 1}: public catalog is still stale.")
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f"Attempt {attempt + 1}: {error}")
              if attempt < 29:
                  time.sleep(10)
          else:
              raise SystemExit("Public catalog does not match the release build.")
          PY
