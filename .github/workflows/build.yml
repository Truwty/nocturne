name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Test and package mod
        shell: pwsh
        run: ./gradlew.bat build --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nocturne-mc26.1.2
          path: |
            build/libs/*.jar
            build/release/nocturne-mc26.1.2.json
          if-no-files-found: error
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        renderer: [vanilla, sodium, iris, optimized]
        include:
          - renderer: vanilla
            modmenu: true
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_GL_VERSION_OVERRIDE: '4.5'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Run Minecraft client checks
        run: xvfb-run -a ./gradlew runClientGameTest -Pcompat=${{ matrix.renderer }} -PwithModMenu=${{ matrix.modmenu || false }} --console=plain
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: client-test-${{ matrix.renderer }}
          path: |
            build/run/clientGameTest/screenshots/**
            build/run/clientGameTest/logs/**
            build/run/clientGameTest/crash-reports/**
            build/run/clientGameTest/nocturne-performance.json
          if-no-files-found: ignore

  reproducible:
    runs-on: ubuntu-24.04
    needs: windows
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Compare two clean release builds
        run: python3 scripts/verify_release.py
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nocturne-mc26.1.2
          path: build/windows-artifact
      - name: Compare Windows and Linux release bytes
        run: python3 scripts/compare_release.py build/windows-artifact
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: release-reproducibility
          path: |
            build/release/*
            build/libs/*.jar

  modern-ports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.10', '1.21.11', '26.1', '26.1.1', '26.2', '26.3']
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_GL_VERSION_OVERRIDE: '4.5'
      # SDL3 can use EGL when the CI virtual display has no matching GLX visual.
      # https://wiki.libsdl.org/SDL3/SDL_HINT_VIDEO_FORCE_EGL
      SDL_VIDEO_FORCE_EGL: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        if: startsWith(matrix.minecraft, '1.')
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Keep the Java 21 game runtime available to toolchains
        if: startsWith(matrix.minecraft, '1.')
        run: echo "NOCTURNE_JAVA21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1
      - name: Verify repeatable release bytes and offline behavior
        run: python3 scripts/verify_release.py --minecraft ${{ matrix.minecraft }}
      - name: Exercise the native Minecraft client
        run: xvfb-run -a ./gradlew runClientGameTest -PminecraftVersion=${{ matrix.minecraft }} -PdisablePacketSync=${{ startsWith(matrix.minecraft, '1.') }} -PwithModMenu=${{ startsWith(matrix.minecraft, '1.') }} --console=plain
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.minecraft == '1.21.11'
        with:
          name: vanilla-1.21.11-smoke-world
          path: build/run/clientGameTest/saves/New World/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: nocturne-mc${{ matrix.minecraft }}
          path: |
            build/minecraft/${{ matrix.minecraft }}/libs/*.jar
            build/minecraft/${{ matrix.minecraft }}/release/*
            build/run/clientGameTest/screenshots/**
            build/run/clientGameTest/logs/**
            build/run/clientGameTest/crash-reports/**
            build/run/clientGameTest/nocturne-performance.json
          if-no-files-found: error

  neoforge:
    runs-on: ubuntu-24.04
    needs: modern-ports
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_GL_VERSION_OVERRIDE: '4.5'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - run: echo "NOCTURNE_JAVA21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: vanilla-1.21.11-smoke-world
          path: build/smoke-fixture
      - name: Verify repeatable NeoForge artifacts and offline behavior
        run: python3 scripts/verify_release.py --minecraft 1.21.11 --loader neoforge
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1
      - name: Exercise the native NeoForge client using local demo lyrics
        env:
          NOCTURNE_SMOKE_WORLD: ${{ github.workspace }}/build/smoke-fixture
        run: |
          timeout 600 xvfb-run -a ./gradlew -Ploader=neoforge -Psmoke=true runClient --console=plain
          python3 -c "import json; r=json.load(open('build/run/neoforge-1.21.11/nocturne-neoforge-smoke.json')); assert r['success'], r"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: nocturne-neoforge-mc1.21.11
          path: |
            build/neoforge/1.21.11/libs/*.jar
            build/neoforge/1.21.11/release/*
            build/run/neoforge-1.21.11/nocturne-neoforge-smoke.json
            build/run/neoforge-1.21.11/screenshots/**
            build/run/neoforge-1.21.11/logs/**
            build/run/neoforge-1.21.11/crash-reports/**

  constrained-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_GL_VERSION_OVERRIDE: '4.5'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Exercise the client with two processors and 2 GiB heap
        run: xvfb-run -a ./gradlew runClientGameTest -PclientTestMemoryMiB=2048 -PclientTestProcessors=2 --console=plain
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: constrained-client-evidence
          path: |
            build/run/clientGameTest/logs/**
            build/run/clientGameTest/nocturne-performance.json
            build/run/clientGameTest/crash-reports/**

  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: node --test scripts/tests/catalog.test.mjs
      - run: python3 scripts/build_site_assets.py
