plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }

def minecraftTarget = providers.gradleProperty('minecraftVersion').getOrElse('26.1.2')
def apiTargets = ['26.1': '0.155.3+26.1.2', '26.1.1': '0.155.3+26.1.2', '26.1.2': '0.155.3+26.1.2', '26.2': '0.161.0+26.2', '26.3': '0.165.0+26.3']
if (!apiTargets.containsKey(minecraftTarget)) throw new GradleException('Unsupported build target: ' + minecraftTarget)
def fabricApiTarget = apiTargets[minecraftTarget]
if (minecraftTarget != '26.1.2') {
    layout.buildDirectory = layout.projectDirectory.dir('build/minecraft/' + minecraftTarget)
    base.archivesName = 'nocturne'
    tasks.withType(Jar).configureEach { archiveClassifier = 'mc' + minecraftTarget + (name == 'sourcesJar' ? '-sources' : '') }
}


loom {
    splitEnvironmentSourceSets()
    mods {
        nocturne {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets.client.java.srcDir('src/compat/' + (minecraftTarget.startsWith('26.1') ? '26.1' : minecraftTarget) + '/java')
sourceSets.client.java.srcDir(minecraftTarget == '26.3' ? 'src/compat/sdl/java' : 'src/compat/glfw/java')

dependencies {
    compileOnly 'maven.modrinth:modmenu:18.0.2'
    if (providers.gradleProperty('withModMenu').getOrElse('false') == 'true') {
        if (!minecraftTarget.startsWith('26.1')) throw new GradleException('The Mod Menu compatibility fixture is pinned to Minecraft 26.1.x')
        runtimeOnly 'maven.modrinth:modmenu:18.0.2'
    }
    minecraft 'com.mojang:minecraft:' + minecraftTarget
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:' + fabricApiTarget
    implementation include('org.yaml:snakeyaml:2.7')
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def compatibility = providers.gradleProperty('compat').getOrElse('vanilla')
if (!(compatibility in ['vanilla', 'sodium', 'iris', 'optimized'])) throw new GradleException('Use -Pcompat=vanilla, sodium, iris or optimized')
if (compatibility != 'vanilla' && minecraftTarget != '26.1.2') throw new GradleException('Renderer compatibility fixtures are pinned to Minecraft 26.1.2')
if (compatibility != 'vanilla') dependencies { runtimeOnly 'maven.modrinth:sodium:mc26.1.2-0.9.2-fabric' }
if (compatibility == 'optimized') dependencies {
    runtimeOnly 'maven.modrinth:lithium:mc26.1.2-0.24.7-fabric'
    runtimeOnly 'maven.modrinth:ferrite-core:9.0.0-fabric'
}
if (compatibility == 'iris') dependencies { runtimeOnly 'maven.modrinth:iris:1.11.4+26.1-fabric' }

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    inputs.property 'minecraftTarget', minecraftTarget
    filesMatching('fabric.mod.json') { expand version: modVersion, minecraft: minecraftTarget, fabricApi: fabricApiTarget.substring(0, fabricApiTarget.indexOf('+')) }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.named('sourcesJar') {
    exclude('native/**')
    if (minecraftTarget != '26.1.2') archiveClassifier = 'mc' + minecraftTarget + '-sources'
}
test {
    useJUnitPlatform()
    inputs.property('liveLyrics', providers.environmentVariable('NOCTURNE_LIVE_LYRICS').getOrElse('false'))
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'nocturne-port-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
sourceSets.gametest.java.srcDir(minecraftTarget.startsWith('26.1') ? 'src/compat/26.1/gametest' : 'src/compat/26.2/gametest')
sourceSets.gametest.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.gametest.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
jar {
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
}

// Optional local compatibility fixtures stay out of release artifacts.
tasks.named('runClientGameTest') {
    workingDir = file('build/run/clientGameTest')
    maxHeapSize = '4G'
    doFirst {
        def runRoot = file('build/run/clientGameTest').canonicalFile
        if (!runRoot.toPath().startsWith(file('build/run').canonicalFile.toPath()) || runRoot.name != 'clientGameTest') throw new GradleException('Unexpected compatibility test directory')
        ['mods','config','resourcepacks','shaderpacks'].each { name -> delete new File(runRoot,name) }
        delete new File(runRoot,'options.txt')
        runRoot.mkdirs()
        def fixture = System.getenv('NOCTURNE_TEST_INSTANCE')
        if (fixture) copy { from fixture; into runRoot }
        def shader = System.getenv('NOCTURNE_TEST_SHADER')
        if (shader) {
            copy { from shader; into new File(runRoot, 'shaderpacks'); rename { 'compat-shader.zip' } }
            def config = new File(runRoot, 'config/iris.properties'); config.parentFile.mkdirs()
            config.text = 'enableShaders=true\nshaderPack=compat-shader.zip\n'
        }
        def resource = System.getenv('NOCTURNE_TEST_RESOURCE')
        if (resource) {
            copy { from resource; into new File(runRoot, 'resourcepacks'); rename { 'compat-resource.zip' } }
            new File(runRoot, 'options.txt').text = 'resourcePacks:["vanilla","file/compat-resource.zip"]\nincompatibleResourcePacks:["file/compat-resource.zip"]\n'
        }
    }
}

// Explicit archive rules also apply to sources and nested release JARs.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def supportManifest = layout.buildDirectory.file('release/nocturne-mc' + minecraftTarget + '.json')
tasks.register('writeSupportManifest') {
    inputs.property('releaseVersion', project.version.toString())
    inputs.property('minecraftTarget', minecraftTarget)
    inputs.property('fabricApiTarget', fabricApiTarget)
    outputs.file(supportManifest)
    doLast {
        def out = supportManifest.get().asFile
        out.parentFile.mkdirs()
        out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            schema: 1, version: project.version.toString(), minecraft: [minecraftTarget],
            loader: 'fabric', environment: 'client', java: 25,
            fabricLoaderMinimum: '0.20.1', fabricApiMinimum: fabricApiTarget
        ])) + '\n', 'UTF-8')
    }
}
tasks.named('assemble') { dependsOn 'writeSupportManifest' }

// Loom enumerates client entries in filesystem order; canonicalize the final archive.
tasks.named('jar') {
    doLast {
        def artifact = archiveFile.get().asFile.toPath()
        def temporary = java.nio.file.Files.createTempFile(artifact.parent, 'nocturne-canonical-', '.jar')
        try {
            new java.util.zip.ZipFile(artifact.toFile()).withCloseable { source ->
                new java.util.zip.ZipOutputStream(java.nio.file.Files.newOutputStream(temporary)).withCloseable { target ->
                    def entries = source.entries().toList().sort { a, b ->
                        def rank = { name -> name == 'META-INF/' ? 0 : name == 'META-INF/MANIFEST.MF' ? 1 : 2 }
                        def order = rank(a.name) <=> rank(b.name)
                        order != 0 ? order : a.name <=> b.name
                    }
                    entries.each { entry ->
                        byte[] data = source.getInputStream(entry).withCloseable { it.bytes }
                        if (entry.name == 'META-INF/MANIFEST.MF') {
                            def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(data))
                            def key = 'Fabric-Loom-Client-Only-Entries'
                            def clientEntries = manifest.mainAttributes.getValue(key)
                            if (clientEntries) manifest.mainAttributes.putValue(key, clientEntries.split(';').sort().join(';'))
                            def buffer = new ByteArrayOutputStream()
                            manifest.write(buffer)
                            data = buffer.toByteArray()
                        }
                        def canonical = new java.util.zip.ZipEntry(entry.name)
                        canonical.setTimeLocal(java.time.LocalDateTime.of(1980, 2, 1, 0, 0))
                        target.putNextEntry(canonical)
                        target.write(data)
                        target.closeEntry()
                    }
                }
            }
            java.nio.file.Files.move(temporary, artifact, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally {
            java.nio.file.Files.deleteIfExists(temporary)
        }
    }
}
